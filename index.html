<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RateMate Currency Converter</title>
<meta name="description" content="A simple, traveller-first currency converter for Android.">
<style>
  :root { --bg: #F5FBF7; --fg: #171D1A; --muted: #3F4945; --accent: #0E6B4F; --line: #DBE5DF; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1512; --fg: #DEE4E0; --muted: #BFC9C3; --accent: #8DD6B6; --line: #3F4945; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 12px; color: var(--accent); }
  p { color: var(--fg); }
  .muted { color: var(--muted); }
  a { color: var(--accent); overflow-wrap: anywhere; }
  nav { margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
  nav p { margin: 0 0 8px; }
</style>
</head>
<body>
<main>
<h1>RateMate Currency Converter</h1>
<p>A simple, traveller-first currency converter for Android.</p>
<nav>
<p><a href="privacy.html">Privacy policy</a></p>
<p>Get it on Google Play</p>
<p class="muted">Contact: <a href="mailto:justdigital.my@gmail.com">justdigital.my@gmail.com</a></p>
</nav>
</main>
</body>
</html>
